<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Admin Casa Só Pimenta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/site/imgs/logo.png">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/admin-global.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/sidebar.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/header.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/table.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/forms.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .metric-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .metric-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .metric-card .metric-border {
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }
    .metric-card .metric-icon {
      font-size: 24px;
      margin-bottom: 8px;
      display: block;
    }
    .metric-card .metric-value {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--color-text-primary);
      line-height: 1.2;
    }
    .metric-card .metric-label {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-top: 4px;
    }
    .metric-card .metric-link {
      margin-top: 8px;
      display: inline-block;
      font-size: var(--font-size-xs);
      color: var(--color-primary);
    }
    .dashboard-section-title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--color-text-primary);
    }
    .dashboard-tables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .dashboard-tables { grid-template-columns: 1fr; }
    }
    .loading-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .skeleton-card {
      height: 120px;
      border-radius: var(--border-radius-md);
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-logo">🌶</span>
      <span class="sidebar-name">Casa Só Pimenta</span>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">←</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/site/pages/admin/index.html" class="nav-item active" data-page="dashboard"><span class="nav-icon">⊞</span><span class="nav-label">Dashboard</span></a>
      <a href="/site/pages/admin/produtos/index.html" class="nav-item" data-page="produtos"><span class="nav-icon">▦</span><span class="nav-label">Produtos</span></a>
      <a href="/site/pages/admin/banners/index.html" class="nav-item" data-page="banners"><span class="nav-icon">◫</span><span class="nav-label">Banners</span></a>
      <a href="/site/pages/admin/kits/index.html" class="nav-item" data-page="kits"><span class="nav-icon">❏</span><span class="nav-label">Kits</span></a>
      <a href="/site/pages/admin/pedidos/index.html" class="nav-item" data-page="pedidos"><span class="nav-icon">≡</span><span class="nav-label">Pedidos</span></a>
      <a href="/site/pages/admin/clientes/index.html" class="nav-item" data-page="clientes"><span class="nav-icon">◎</span><span class="nav-label">Clientes</span></a>
      <a href="/site/pages/admin/cupons/index.html" class="nav-item" data-page="cupons"><span class="nav-icon">◈</span><span class="nav-label">Cupons</span></a>
      <a href="/site/pages/admin/categorias/index.html" class="nav-item" data-page="categorias"><span class="nav-icon">◉</span><span class="nav-label">Categorias</span></a>
      <a href="/site/pages/admin/configuracoes/index.html" class="nav-item" data-page="configuracoes"><span class="nav-icon">⚙</span><span class="nav-label">Configurações</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebarUserName">Admin</span>
          <span class="sidebar-user-role">Administrador</span>
        </div>
      </div>
      <button class="btn-logout" id="btnLogout">↩ Sair</button>
    </div>
  </aside>

  <div class="admin-layout">
    <header class="admin-header">
      <div class="header-right">
        <div class="header-user">
          <span class="header-user-name" id="headerUserName">Admin</span>
          <div class="header-avatar" id="headerAvatar">A</div>
        </div>
      </div>
    </header>

    <main class="admin-main" id="adminMain">
      <div class="dashboard-grid" id="metricCards"></div>

      <h3 class="dashboard-section-title">Últimos pedidos</h3>
      <div class="table-container" id="recentOrders"></div>

      <h3 class="dashboard-section-title" style="margin-top:24px;">Estoque crítico</h3>
      <div class="table-container" id="lowStockTable"></div>
    </main>
  </div>

  <script src="/site/assets/js/config.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/admin-auth.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/sidebar.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/dashboard.js"></script>
</body>
</html>
