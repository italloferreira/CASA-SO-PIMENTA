<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Admin Casa Só Pimenta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/site/imgs/logo.png">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/admin-global.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/sidebar.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/header.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/table.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/modal.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/forms.css">
  <style>
    .drawer-image-preview {
      width: 100%;
      max-width: 200px;
      height: 100px;
      object-fit: cover;
      border-radius: var(--border-radius-sm);
      background: var(--color-bg);
    }
    .prod-images-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .prod-images-preview:empty {
      display: none;
    }
    .prod-image-thumb {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: var(--border-radius-sm);
      overflow: hidden;
      border: 2px solid var(--color-border);
      background: var(--color-bg);
    }
    .prod-image-thumb.principal {
      border-color: var(--color-primary, #c0392b);
    }
    .prod-image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .prod-image-thumb .thumb-badge {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 10px;
      padding: 2px 6px;
      color: #fff;
      background: var(--color-primary, #c0392b);
      border-radius: 0 0 6px 0;
    }
    .prod-image-thumb .thumb-remove {
      position: absolute;
      top: 0;
      right: 0;
      width: 20px;
      height: 20px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      border-radius: 0 0 0 6px;
    }
    .prod-image-thumb .thumb-main {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      border: none;
      cursor: pointer;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font-size: 10px;
      padding: 3px 0;
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-logo">🌶</span>
      <span class="sidebar-name">Casa Só Pimenta</span>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">←</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/site/pages/admin/index.html" class="nav-item" data-page="dashboard"><span class="nav-icon">⊞</span><span class="nav-label">Dashboard</span></a>
      <a href="/site/pages/admin/produtos/index.html" class="nav-item active" data-page="produtos"><span class="nav-icon">▦</span><span class="nav-label">Produtos</span></a>
      <a href="/site/pages/admin/banners/index.html" class="nav-item" data-page="banners"><span class="nav-icon">◫</span><span class="nav-label">Banners</span></a>
      <a href="/site/pages/admin/kits/index.html" class="nav-item" data-page="kits"><span class="nav-icon">❏</span><span class="nav-label">Kits</span></a>
      <a href="/site/pages/admin/pedidos/index.html" class="nav-item" data-page="pedidos"><span class="nav-icon">≡</span><span class="nav-label">Pedidos</span></a>
      <a href="/site/pages/admin/clientes/index.html" class="nav-item" data-page="clientes"><span class="nav-icon">◎</span><span class="nav-label">Clientes</span></a>
      <a href="/site/pages/admin/cupons/index.html" class="nav-item" data-page="cupons"><span class="nav-icon">◈</span><span class="nav-label">Cupons</span></a>
      <a href="/site/pages/admin/categorias/index.html" class="nav-item" data-page="categorias"><span class="nav-icon">◉</span><span class="nav-label">Categorias</span></a>
      <a href="/site/pages/admin/configuracoes/index.html" class="nav-item" data-page="configuracoes"><span class="nav-icon">⚙</span><span class="nav-label">Configurações</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebarUserName">Admin</span>
          <span class="sidebar-user-role">Administrador</span>
        </div>
      </div>
      <button class="btn-logout" id="btnLogout">↩ Sair</button>
    </div>
  </aside>

  <div class="admin-layout">
    <header class="admin-header">
      <div class="header-right">
        <div class="header-user">
          <span class="header-user-name" id="headerUserName">Admin</span>
          <div class="header-avatar" id="headerAvatar">A</div>
        </div>
      </div>
    </header>

    <main class="admin-main" id="adminMain">
      <div class="table-toolbar">
        <div class="toolbar-left">
          <input type="text" class="form-input toolbar-search" placeholder="Buscar..." id="searchInput">
          <select class="form-input toolbar-filter" id="filterCategory">
            <option value="">Todas as categorias</option>
          </select>
          <select class="form-input toolbar-filter" id="filterActive">
            <option value="">Todos</option>
            <option value="active">Ativos</option>
            <option value="inactive">Inativos</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnNovoProduto">+ Novo Produto</button>
      </div>
      <div class="table-container" id="tableContainer"><div class="skeleton skeleton-table"></div></div>
    </main>
  </div>

  <!-- DRAWER -->
  <div class="modal-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h2 id="drawerTitle">Novo Produto</h2>
      <button class="drawer-close" id="drawerClose">&times;</button>
    </div>
    <div class="drawer-body">
      <form id="productForm">
        <input type="hidden" id="productId">

        <div class="form-group">
          <label class="form-label" for="prodName">Nome *</label>
          <input type="text" class="form-input" id="prodName" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="prodSlug">Slug</label>
          <input type="text" class="form-input" id="prodSlug" placeholder="Deixe em branco para gerar automaticamente">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="prodCategory">Categoria *</label>
            <select class="form-input" id="prodCategory" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="prodPrice">Preço (R$) *</label>
            <input type="number" step="0.01" min="0" class="form-input" id="prodPrice" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="prodComparePrice">Preço comparativo (R$)</label>
            <input type="number" step="0.01" min="0" class="form-input" id="prodComparePrice" placeholder="Deixe vazio se não houver">
          </div>
          <div class="form-group">
            <label class="form-label" for="prodStock">Em estoque</label>
            <input type="checkbox" class="form-input" id="prodStock" style="width:auto;height:auto;">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="prodDescription">Descrição</label>
          <textarea class="form-input form-textarea" id="prodDescription" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="prodIngredients">Ingredientes</label>
          <input type="text" class="form-input" id="prodIngredients" placeholder="Separados por vírgula, ex: Pimenta, Sal, Alho">
        </div>

        <div class="form-group">
          <label class="form-label">Imagens <small style="color:var(--color-text-muted);font-weight:normal;">(a primeira é a imagem principal)</small></label>
          <div class="form-file-upload">
            <input type="file" accept="image/*" multiple id="prodImagesInput">
            <span>Clique para selecionar ou arraste as imagens aqui (máx. 2 MB cada)</span>
          </div>
          <div id="prodImagesPreview" class="prod-images-preview"></div>
          <input type="hidden" id="prodImageUrl">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label form-label-inline">
              <input type="checkbox" id="prodActive" checked>
              Ativo (visível na loja)
            </label>
          </div>
          <div class="form-group">
            <label class="form-label form-label-inline">
              <input type="checkbox" id="prodFeatured">
              Destaque (vitrine)
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="prodWeight">Peso (kg) <small style="color:var(--color-text-muted);font-weight:normal;">— cálculo interno do frete</small></label>
          <input type="number" step="0.001" min="0" class="form-input" id="prodWeight" placeholder="Opcional — usado apenas para calcular frete">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="drawerCancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnSaveProduct">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div class="modal-overlay" id="confirmOverlay"></div>
  <div class="modal confirm-modal" id="confirmModal">
    <div class="modal-header"><h3>Confirmar exclusão</h3></div>
    <div class="modal-body"><p id="confirmMessage">Tem certeza que deseja excluir este item?</p></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="confirmCancel">Cancelar</button>
      <button class="btn btn-danger" id="confirmDelete">Excluir</button>
    </div>
  </div>

  <script src="/site/assets/js/config.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/admin-auth.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/sidebar.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/produtos.js"></script>
</body>
</html>
