<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupons — Admin Casa Só Pimenta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/site/imgs/logo.png">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/admin-global.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/sidebar.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/header.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/table.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/modal.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/forms.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-logo">🌶</span>
      <span class="sidebar-name">Casa Só Pimenta</span>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">←</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/site/pages/admin/index.html" class="nav-item" data-page="dashboard"><span class="nav-icon">⊞</span><span class="nav-label">Dashboard</span></a>
      <a href="/site/pages/admin/produtos/index.html" class="nav-item" data-page="produtos"><span class="nav-icon">▦</span><span class="nav-label">Produtos</span></a>
      <a href="/site/pages/admin/banners/index.html" class="nav-item" data-page="banners"><span class="nav-icon">◫</span><span class="nav-label">Banners</span></a>
      <a href="/site/pages/admin/kits/index.html" class="nav-item" data-page="kits"><span class="nav-icon">❏</span><span class="nav-label">Kits</span></a>
      <a href="/site/pages/admin/pedidos/index.html" class="nav-item" data-page="pedidos"><span class="nav-icon">≡</span><span class="nav-label">Pedidos</span></a>
      <a href="/site/pages/admin/clientes/index.html" class="nav-item" data-page="clientes"><span class="nav-icon">◎</span><span class="nav-label">Clientes</span></a>
      <a href="/site/pages/admin/cupons/index.html" class="nav-item active" data-page="cupons"><span class="nav-icon">◈</span><span class="nav-label">Cupons</span></a>
      <a href="/site/pages/admin/categorias/index.html" class="nav-item" data-page="categorias"><span class="nav-icon">◉</span><span class="nav-label">Categorias</span></a>
      <a href="/site/pages/admin/configuracoes/index.html" class="nav-item" data-page="configuracoes"><span class="nav-icon">⚙</span><span class="nav-label">Configurações</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebarUserName">Admin</span>
          <span class="sidebar-user-role">Administrador</span>
        </div>
      </div>
      <button class="btn-logout" id="btnLogout">↩ Sair</button>
    </div>
  </aside>

  <div class="admin-layout">
    <header class="admin-header">
      <div class="header-right">
        <div class="header-user">
          <span class="header-user-name" id="headerUserName">Admin</span>
          <div class="header-avatar" id="headerAvatar">A</div>
        </div>
      </div>
    </header>

    <main class="admin-main" id="adminMain">
      <div class="table-toolbar">
        <div class="toolbar-left">
          <input type="text" class="form-input toolbar-search" placeholder="Buscar cupom..." id="searchInput">
        </div>
        <button class="btn btn-primary" id="btnNovoCupom">+ Novo Cupom</button>
      </div>
      <div class="table-container" id="tableContainer"><div class="empty-state"><span class="empty-icon">◈</span><p>Carregando...</p></div></div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Novo Cupom</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="cupomForm">
        <input type="hidden" id="cupomIndex">

        <div class="form-group">
          <label class="form-label" for="cupomCode">Código *</label>
          <input type="text" class="form-input" id="cupomCode" required style="text-transform:uppercase;">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="cupomDiscountType">Tipo de desconto *</label>
            <select class="form-input" id="cupomDiscountType" required>
              <option value="fixed">Valor fixo (R$)</option>
              <option value="percentage">Percentual (%)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="cupomDiscount">Valor do desconto *</label>
            <input type="number" step="0.01" min="0" class="form-input" id="cupomDiscount" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="cupomMinOrder">Pedido mínimo (R$)</label>
            <input type="number" step="0.01" min="0" class="form-input" id="cupomMinOrder">
          </div>
          <div class="form-group">
            <label class="form-label" for="cupomMaxUses">Limite de usos</label>
            <input type="number" step="1" min="0" class="form-input" id="cupomMaxUses">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="cupomExpires">Data de validade</label>
          <input type="date" class="form-input" id="cupomExpires">
        </div>

        <div class="form-group">
          <label class="form-label form-label-inline">
            <input type="checkbox" id="cupomActive" checked>
            Ativo
          </label>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="modalCancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnSaveCupom">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIRM -->
  <div class="modal-overlay" id="confirmOverlay"></div>
  <div class="modal confirm-modal" id="confirmModal">
    <div class="modal-header"><h3>Confirmar exclusão</h3></div>
    <div class="modal-body"><p id="confirmMessage">Tem certeza?</p></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="confirmCancel">Cancelar</button>
      <button class="btn btn-danger" id="confirmDelete">Excluir</button>
    </div>
  </div>

  <script src="/site/assets/js/config.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/admin-auth.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/sidebar.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/cupons.js"></script>
</body>
</html>
