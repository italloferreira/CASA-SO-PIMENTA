<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias — Admin Casa Só Pimenta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/site/imgs/logo.png">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/admin-global.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/sidebar.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/header.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/table.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/modal.css">
  <link rel="stylesheet" href="/site/pages/admin/assets/css/forms.css">
  <style>
    .category-color-preview {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: inline-block;
      vertical-align: middle;
      border: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-logo">🌶</span>
      <span class="sidebar-name">Casa Só Pimenta</span>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">←</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/site/pages/admin/index.html" class="nav-item" data-page="dashboard"><span class="nav-icon">⊞</span><span class="nav-label">Dashboard</span></a>
      <a href="/site/pages/admin/produtos/index.html" class="nav-item" data-page="produtos"><span class="nav-icon">▦</span><span class="nav-label">Produtos</span></a>
      <a href="/site/pages/admin/banners/index.html" class="nav-item" data-page="banners"><span class="nav-icon">◫</span><span class="nav-label">Banners</span></a>
      <a href="/site/pages/admin/kits/index.html" class="nav-item" data-page="kits"><span class="nav-icon">❏</span><span class="nav-label">Kits</span></a>
      <a href="/site/pages/admin/pedidos/index.html" class="nav-item" data-page="pedidos"><span class="nav-icon">≡</span><span class="nav-label">Pedidos</span></a>
      <a href="/site/pages/admin/clientes/index.html" class="nav-item" data-page="clientes"><span class="nav-icon">◎</span><span class="nav-label">Clientes</span></a>
      <a href="/site/pages/admin/cupons/index.html" class="nav-item" data-page="cupons"><span class="nav-icon">◈</span><span class="nav-label">Cupons</span></a>
      <a href="/site/pages/admin/categorias/index.html" class="nav-item active" data-page="categorias"><span class="nav-icon">◉</span><span class="nav-label">Categorias</span></a>
      <a href="/site/pages/admin/configuracoes/index.html" class="nav-item" data-page="configuracoes"><span class="nav-icon">⚙</span><span class="nav-label">Configurações</span></a>
      <a href="/catalogo" class="nav-item" target="_blank" rel="noopener" data-page="catalogo"><span class="nav-icon">⎙</span><span class="nav-label">Ver catálogo</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebarUserName">Admin</span>
          <span class="sidebar-user-role">Administrador</span>
        </div>
      </div>
      <button class="btn-logout" id="btnLogout">↩ Sair</button>
    </div>
  </aside>

  <div class="admin-layout">
    <header class="admin-header">
      <div class="header-right">
        <div class="header-user">
          <span class="header-user-name" id="headerUserName">Admin</span>
          <div class="header-avatar" id="headerAvatar">A</div>
        </div>
      </div>
    </header>

    <main class="admin-main" id="adminMain">
      <div class="table-toolbar">
        <div class="toolbar-left">
          <input type="text" class="form-input toolbar-search" placeholder="Buscar categoria..." id="searchInput">
        </div>
        <button class="btn btn-primary" id="btnNovaCategoria">+ Nova Categoria</button>
      </div>
      <div class="table-container" id="tableContainer"><div class="skeleton skeleton-table"></div></div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="modal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Nova Categoria</h2>
        <button type="button" class="modal-close" id="modalClose" aria-label="Fechar">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="categoriaForm" class="modal-form">
        <div class="modal-body">
          <input type="hidden" id="categoriaId">

          <div class="form-group">
            <label class="form-label" for="catName">Nome <span class="form-required" aria-hidden="true">*</span></label>
            <input type="text" class="form-input" id="catName" required placeholder="Ex: Molhos">
          </div>

          <div class="form-group">
            <label class="form-label" for="catSlug">Slug</label>
            <input type="text" class="form-input" id="catSlug" placeholder="molhos" aria-describedby="catSlugHint">
            <span class="form-hint" id="catSlugHint">Em branco, é gerado automaticamente a partir do nome.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="catColorText">Cor</label>
            <div class="color-field">
              <input type="color" class="form-input color-swatch" id="catColor" value="#8B2E00" aria-label="Escolher cor">
              <input type="text" class="form-input color-hex" id="catColorText" placeholder="#RRGGBB" value="#8B2E00" maxlength="7">
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modalCancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnSaveCategoria">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIRM -->
  <div class="modal-overlay" id="confirmOverlay"></div>
  <div class="modal confirm-modal" id="confirmModal">
    <div class="modal-content" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
      <div class="modal-body">
        <span class="confirm-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </span>
        <h3 class="confirm-title" id="confirmTitle">Confirmar exclusão</h3>
        <p class="confirm-text" id="confirmMessage">Tem certeza?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="confirmCancel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Excluir</button>
      </div>
    </div>
  </div>

  <script src="/site/assets/js/config.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/admin-auth.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/sidebar.js"></script>
  <script type="module" src="/site/pages/admin/assets/js/categorias.js"></script>
</body>
</html>
